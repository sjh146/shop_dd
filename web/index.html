<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seoul Crate — Korean everyday essentials, shipped to the U.S. (MetaMask / USDC)</title>
    <meta
      name="description"
      content="We buy everyday essentials in Seoul and ship them to U.S. addresses. Browse in USD and check out with USDC from your MetaMask wallet."
    />
    <meta property="og:title" content="Seoul Crate — Korean everyday essentials, shipped to the U.S." />
    <meta
      property="og:description"
      content="Everyday essentials sourced in Korea and shipped to the United States. USD pricing, MetaMask / USDC checkout."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <!--
      Structured data for search engines and AI agents — readable without running JS.
      Machine-readable summary: /llms.txt
      ⚠️ Testnet values. When switching to Base mainnet, update paymentNetwork/chainId/
      realPayments here, the body data-* attributes below, and web/src/lib/config.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Seoul Crate",
        "description": "Korean everyday essentials bought in Seoul and shipped to U.S. addresses. Checkout pays in USDC with MetaMask.",
        "areaServed": "US",
        "currenciesAccepted": "USD, USDC",
        "paymentAccepted": "MetaMask wallet only (USDC on Base Sepolia testnet)",
        "additionalProperty": [
          { "@type": "PropertyValue", "name": "paymentMethod", "value": "MetaMask wallet only" },
          { "@type": "PropertyValue", "name": "paymentToken", "value": "USDC (mock, 6 decimals)" },
          { "@type": "PropertyValue", "name": "paymentNetwork", "value": "Base Sepolia (testnet)" },
          { "@type": "PropertyValue", "name": "chainId", "value": "84532" },
          { "@type": "PropertyValue", "name": "realPayments", "value": "false (testnet demo)" },
          { "@type": "PropertyValue", "name": "fulfillment", "value": "Purchased in Korea, shipped to the customer's U.S. address" }
        ]
      }
    </script>
  </head>
  <body data-payment-method="metamask" data-payment-mode="testnet" data-market="us">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
